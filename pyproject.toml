[project]
name = "rox-docs"
version = "0.1.0"
description = "Generates linked HTML design docs for Rox codebases"
readme = "README.md"
authors = [
    { name = "Devin AI", email = "158243242+devin-ai-integration[bot]@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
]

[tool.uv]
exclude-newer = "2026-09-23T00:00:00Z"

[project.scripts]
rox-docs = "rox_docs.build:main"
